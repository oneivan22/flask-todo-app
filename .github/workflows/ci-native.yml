name: Flask CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke test Flask server
      run: |
        python manage.py &
        SERVER_PID=$!
        sleep 5
        curl -s -o /dev/null -w "%{http_code}" http://localhost:7345 | grep 200
        kill $SERVER_PID
